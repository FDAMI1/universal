name: Build Android (.aab)

# Run it manually from the GitHub "Actions" tab -> "Build Android (.aab)" ->
# "Run workflow". Builds with `eas build --local` on GitHub's free Ubuntu runner
# (no EAS build credits used) and uploads the result as a download.
#
# Pick a profile when you run it:
#   - production -> signed .aab for the Play Store (default)
#   - preview    -> installable .apk you can sideload straight onto a test phone
#                  (much faster to iterate than uploading an .aab to Play)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - production
          - preview
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space (remove preinstalled tools we don't need)
        run: |
          echo "Disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy || true
          sudo docker image prune -a -f || true
          echo "Disk after:"; df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle (reuse compiled native libs across runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'app.json', 'eas.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Setup Android SDK (puts sdkmanager on PATH + accepts licenses)
        uses: android-actions/setup-android@v3
        with:
          # default is "tools platform-tools"; the legacy "tools" package no longer exists
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Pick output extension for the profile
        id: out
        run: |
          if [ "${{ inputs.profile }}" = "preview" ]; then
            echo "ext=apk" >> "$GITHUB_OUTPUT"
          else
            echo "ext=aab" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (local — free, no EAS credits)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --output "${{ github.workspace }}/app-release.${{ steps.out.outputs.ext }}"

      - name: Publish build to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-${{ inputs.profile }}-${{ github.run_number }}"
          gh release create "$TAG" \
            "app-release.${{ steps.out.outputs.ext }}" \
            --title "Android ${{ inputs.profile }} build #${{ github.run_number }}" \
            --notes "Automated \`eas build --local\` output. Download the .${{ steps.out.outputs.ext }} file below." \
            --prerelease
