; VS Code + PlatformIO build for the sound box. Open the `firmware` folder in VS Code.
; Same sources as the Arduino IDE sketch; nothing is duplicated.

[platformio]
src_dir = universal-speaker

[env:esp32dev]
; Arduino core 3.x is required (driver/dac_continuous.h). The stock "espressif32" platform is still on 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
; Voice clips are compiled into the firmware (~2.6 MB), so the default 1.2 MB app partition is too small.
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson@^7
